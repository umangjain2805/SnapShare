name: Release images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    # Run after CI passes on this exact commit; protected environment requires reviewer approval.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit tags
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          prefix="ghcr.io/${REPOSITORY,,}"
          for target in api worker web; do
            docker buildx build --target "$target" --tag "$prefix/$target:$COMMIT" --push .
          done

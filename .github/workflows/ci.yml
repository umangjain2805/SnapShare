name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-storage.txt
      - run: pnpm test:browser:workspace
      - run: docker compose up -d --wait
      - run: pnpm storage:setup
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/snapshare?replicaSet=rs0
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: snapshare-private
          S3_ACCESS_KEY_ID: local-development
          S3_SECRET_ACCESS_KEY: local-development
      - run: docker compose exec -T mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'
      - run: docker compose exec -T redis redis-cli ping
      - if: always()
        run: docker compose down

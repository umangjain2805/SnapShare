services:
  mongo:
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { if (!db.hello().isWritablePrimary) { try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; quit(1) } } catch (e) { quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mongo-data:
  redis-data:
